<div class="ai-chat-container">

  <!-- Cronologia intera della conversazione passata dal padre -->
  <div class="chat-messages-scroll">
    @for (msg of messages(); track $index) {
      <div class="chat-bubble" [class.ai-bubble]="msg.sender === 'ai'" [class.user-bubble]="msg.sender === 'user'">
        <p class="chat-text">{{ msg.text }}</p>
      </div>
    }
  </div>

  <!-- Gruppo di Input -->
  <div class="input-group">
    <input
      type="text"
      class="chat-input"
      placeholder="{{ isDictating() ? 'Registrazione in corso...' : 'Chiedi all\'IA...' }}"
      maxlength="200"
      [disabled]="isDictating()"
      [(ngModel)]="chatText"
      (keyup.enter)="onActionButtonClick()"
    />

    <button
      type="button"
      class="btn-mic"
      [class.recording]="isDictating()"
      (click)="onActionButtonClick()"
      aria-label="Azione chat"
    >
      @if(chatText().trim().length > 0 && !isDictating()) {
        <!-- Icona Invia (Aeroplanino) -->
        <svg class="icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z"/></svg>
      } @else {
        <!-- Icona Microfono -->
        <svg class="icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M395-435q-35-35-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35q-50 0-85-35Zm85-205Zm-40 520v-123q-104-14-172-93t-68-184h80q0 83 58.5 141.5T480-320q83 0 141.5-58.5T680-520h80q0 105-68 184t-172 93v123h-80Zm68.5-371.5Q520-503 520-520v-240q0-17-11.5-28.5T480-800q-17 0-28.5 11.5T440-760v240q0 17 11.5 28.5T480-480q17 0 28.5-11.5Z"/></svg>
      }
    </button>
  </div>

  <div class="char-counter">{{ remainingChars() }} caratteri rimanenti</div>
</div>
