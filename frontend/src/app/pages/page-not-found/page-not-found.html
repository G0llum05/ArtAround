<main class="not-found-wrapper" aria-label="Pagina non trovata">
  <!-- Contenuto Testuale (Sopra su Mobile, Sinistra su Desktop) -->
  <div class="not-found-content">
    <h1 class="not-found-title">C'è stato un problema</h1>
    <p class="not-found-desc">
      La pagina che stai cercando non esiste o potrebbe essere stata spostata. Verifica l'indirizzo inserito oppure torna alla home.
    </p>
    <div class="not-found-actions">
      <a routerLink="/" class="btn btn-primary" aria-label="Torna alla home" tabindex="0">Torna alla Home</a>
      <button (click)="goBack()" class="btn btn-secondary" aria-label="Torna alla pagina precedente" tabindex="0">Torna indietro</button>
    </div>
  </div>

  <div class="not-found-image-container desktop-only">
    <img src="/assets/images/pageNotFound.png" alt="Illustrazione errore 404 pagina non trovata" class="not-found-img" />
  </div>

</main>
