<section class="results-section">
  <header class="results-header">
    <h2 class="results-title"> Musei </h2>
    <p class="results-subtitle">
      @if (!isLoading()) {
        I musei con cui collaboriamo
      } @else {
        Stiamo caricando i musei con cui collaboriamo
      }
    </p>
  </header>

  <div class="results-grid">
    <!-- SKELETON LOADER -->
    @if (isLoading()) {
      @for (skeleton of [1, 2, 3, 4, 5, 6]; track skeleton) {
        <div class="skeleton-card">
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton-content">
            <div class="skeleton skeleton-text" style="width: 80%; height: 1.5rem;"></div>
            <div class="skeleton skeleton-text" style="width: 60%;"></div>
            <div class="skeleton skeleton-text" style="width: 50%;"></div>
          </div>
        </div>
      }
    } @else {
      <ng-content></ng-content>
      <!-- EMPTY STATE -->
      @if (length() === 0) {
        <div class="empty-state">
          <p>Nessuna visita corrisponde ai tuoi filtri.</p>
        </div>
      }
    }
  </div>
</section>
