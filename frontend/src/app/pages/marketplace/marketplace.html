<main class="angular-mkt-container" aria-label="Marketplace delle visite">
  <!-- IL NOSTRO PONTE: Inseriamo il tag Vanilla -->
  <!-- (messaggio-da-vanilla) è il nome del CustomEvent che abbiamo definito nel file .js -->
  <!-- [attr.routes] obbliga angular ad usare setAttribute('route', ...) e quindi a creare un nuovo attributo e non a cercare fare quelli esistenti -->
  <mkt-router 
              [attr.user-id]="authService.currentUser()?.userId"
              [attr.user-role]="authService.userRole()"
              [attr.route]="currentRoute()"
              (angular-navigate)="navigateTo($event)">
  </mkt-router>
</main>
