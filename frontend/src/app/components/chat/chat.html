<div class="ai-chat-container" [class.collapsed]="isCollapsed()">

  <div class="chat-header-bar">
    <span class="chat-header-title">Guida Virtuale</span>
    <button
      type="button"
      class="btn-toggle-collapse"
      (click)="toggleCollapse.emit()"
      [title]="isCollapsed() ? 'Espandi chat' : 'Riduci chat'"
      aria-label="Riduci o espandi chat"
    >
      <svg class="collapse-icon" [class.rotated]="isCollapsed()" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  @if (!isCollapsed()) {
    <div class="chat-messages-scroll" #scrollContainer>
      @for (msg of messages(); track $index) {
        <div class="chat-bubble" [class.ai-bubble]="msg.sender === 'ai'" [class.user-bubble]="msg.sender === 'user'">
          <p class="chat-text">{{ msg.text }}</p>
        </div>
      }
    </div>
  }

  <div class="voice-input-group">
    <button
      type="button"
      class="btn-voice-record"
      [class.recording]="isDictating()"
      (click)="toggleDictation.emit()"
      aria-label="Registra domanda vocale"
    >
      @if(isDictating()) {
        <svg class="icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M520-200v-560h240v560H520Zm-320 0v-560h240v560H200Zm400-80h80v-400h-80v400Zm-320 0h80v-400h-80v400Zm0-400v400-400Zm320 0v400-400Z"/></svg>
        <span>Ferma e invia</span>
      } @else {
        <svg class="icon-md" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M395-435q-35-35-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35q-50 0-85-35Zm85-205Zm-40 520v-123q-104-14-172-93t-68-184h80q0 83 58.5 141.5T480-320q83 0 141.5-58.5T680-520h80q0 105-68 184t-172 93v123h-80Zm68.5-371.5Q520-503 520-520v-240q0-17-11.5-28.5T480-800q-17 0-28.5 11.5T440-760v240q0 17 11.5 28.5T480-480q17 0 28.5-11.5Z"/></svg>
        <span>Parla con l'Assistente</span>
      }
    </button>
  </div>
</div>
