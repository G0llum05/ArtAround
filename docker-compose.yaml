services:
  mongo_site252623:
    image: mongo:latest
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: backend
    restart: always
    environment:
      NODE_ENV: development
      DB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo_site252623:27017/${MONGO_DATABASE}?authSource=admin
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo_site252623
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    environment:
      NODE_ENV: development
    ports:
      - "4200:4200"
    command: ["npx", "ng", "serve", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

# Volumi per la persistenza dei dati
volumes:
  mongo_data:
