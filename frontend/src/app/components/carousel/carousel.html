<div class="carousel-container">
  <div class="carousel-wrapper">

    <!-- Freccia Sinistra -->
    @if (items && items.length > 1) {
      <button class="nav-arrow prev-arrow" (click)="prev()" aria-label="Precedente" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/>
        </svg>
      </button>
    }

    <!-- Viewport del carosello -->
    <div class="carousel-viewport">
      <div class="carousel-track" [style.transform]="'translateX(-' + (currentIndex() * 100) + '%)'">
        @for (item of items; track item.id || $index) {
          <div class="carousel-slide" [style.background-image]="'url(' + item.image + ')'">
            <div class="carousel-overlay">

              <!-- Contenuto in sovraimpressione (Badge, Titolo, Descrizione, Pulsante) -->
              <div class="slide-content">
                @if (item.badge) {
                  <span class="badge" [class.badge-accent]="item.badgeType === 'accent'">
                    {{ item.badge }}
                  </span>
                }
                <h3 class="slide-title">{{ item.title }}</h3>
                <p class="slide-desc">{{ item.subtitle || item.description }}</p>

                <button class="btn-primary" type="button">
                  {{ item.buttonText || 'SCOPRI DI PIÙ' }}
                  <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
                    <path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/>
                  </svg>
                </button>
              </div>

            </div>
          </div>
        }
      </div>
    </div>

    <!-- Freccia Destra -->
    @if (items && items.length > 1) {
      <button class="nav-arrow next-arrow" (click)="next()" aria-label="Successivo" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/>
        </svg>
      </button>
    }

  </div>

  <!-- Puntini di navigazione (Dots) -->
  @if (items && items.length > 1) {
    <div class="carousel-dots">
      @for (item of items; track $index) {
        <button
          type="button"
          class="dot"
          [class.active]="currentIndex() === $index"
          (click)="goTo($index)"
          [attr.aria-label]="'Vai alla diapositiva ' + ($index + 1)">
        </button>
      }
    </div>
  }
</div>
