<div class="page-container">
  <h2>Creazione Nuovo Artwork (Opera d'Arte)</h2>

  <div *ngIf="feedbackMessage" class="alert alert-success">{{ feedbackMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <section class="card">
    <div class="form-group">
      <label for="artworkTitle">Titolo Opera *</label>
      <input id="artworkTitle" type="text" [(ngModel)]="artworkForm.title" placeholder="es. Gioconda" />
    </div>

    <div class="form-group">
      <label for="startYear">Anno Inizio</label>
      <input id="startYear" type="number" [(ngModel)]="artworkForm.startYear" placeholder="1503" />
    </div>

    <div class="form-group">
      <label for="endYear">Anno Fine</label>
      <input id="endYear" type="number" [(ngModel)]="artworkForm.endYear" placeholder="1519" />
    </div>

    <div class="form-group">
      <label for="selectArtist">Artista Associato</label>
      <select id="selectArtist" [(ngModel)]="artworkForm.selectedArtistId">
        <option value="">-- Nessun Artista --</option>
        <option *ngFor="let a of artists" [value]="a._id">{{ a.name }} {{ a.surname }} (ID: {{ a._id }})</option>
      </select>
    </div>

    <div class="form-group">
      <label for="selectMuseum">Museo Associato</label>
      <select id="selectMuseum" [(ngModel)]="artworkForm.selectedMuseumId">
        <option value="">-- Nessun Museo --</option>
        <option *ngFor="let m of museums" [value]="m._id">{{ m.name }} (ID: {{ m._id }})</option>
      </select>
    </div>

    <div class="form-group">
      <label for="artCurrents">Correnti Artistiche (separate da virgola)</label>
      <input id="artCurrents" type="text" [(ngModel)]="artworkForm.artisticCurrents" placeholder="es. Rinascimento" />
    </div>

    <div class="form-inline">
      <label><input type="checkbox" [(ngModel)]="artworkForm.isActive" /> Attiva per Visite</label>
      <label><input type="checkbox" [(ngModel)]="artworkForm.isPrivate" /> Opera Privata</label>
    </div>

    <button class="btn-submit" (click)="createArtwork()">Salva Opera</button>
  </section>

  <section class="card summary-card" *ngIf="artworks.length > 0">
    <h3>Opere Presenti nel Database ({{ artworks.length }})</h3>
    <ul>
      <li *ngFor="let art of artworks">
        <strong>{{ art.title }}</strong> — <small>ID: {{ art._id }}</small>
        <span *ngIf="art.startYear">({{ art.startYear }} - {{ art.endYear || '?' }})</span>
      </li>
    </ul>
  </section>
</div>
