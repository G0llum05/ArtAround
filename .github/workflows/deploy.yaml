name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Eseguire il seed del database/immagini?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Backend (Installa dipendenze per la produzione)
        run: |
          cd backend
          npm ci --omit=dev

      - name: Crea file .env iniettando i Github Secrets
        run: |
          echo "MONGO_DATABASE=${{ secrets.LAB_MONGO_DATABASE }}" >> .env
          echo "MONGO_HOST=${{ secrets.LAB_MONGO_HOST }}" >> .env
          echo "MONGO_PORT=${{ secrets.LAB_MONGO_PORT }}" >> .env
          echo "MONGO_USER=${{ secrets.LAB_MONGO_USER }}" >> .env
          echo "MONGO_PASSWORD=${{ secrets.LAB_MONGO_PASSWORD }}" >> .env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}" >> .env
          echo "CLIENT_URL=${{ secrets.CLIENT_URL }}" >> .env
          echo "BACKEND_URL=${{ secrets.BACKEND_URL }}" >> .env
          echo "NOREPLY_PASSWORD=${{ secrets.NOREPLY_PASSWORD }}" >> .env
          echo "ADMIN1=${{ secrets.ADMIN1 }}" >> .env
          echo "ADMIN2=${{ secrets.ADMIN2 }}" >> .env
          echo "ADMIN3=${{ secrets.ADMIN3 }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "GROQ_MODEL=${{ secrets.GROQ_MODEL }}" >> .env
          echo "GROQ_STT_MODEL=${{ secrets.GROQ_STT_MODEL }}" >> .env
          echo "RESPONSIVEVOICE_API_KEY=${{ secrets.RESPONSIVEVOICE_API_KEY }}" >> .env
          echo "RESPONSIVEVOICE_SECRET=${{ secrets.RESPONSIVEVOICE_PROD_SECRET }}" >> .env

      - name: Build Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Deploy via SCP Nativo
        run: |
          sudo apt-get install -y sshpass
          tar -zcf deploy.tar.gz frontend/dist/ backend/ docker-compose.yaml .env
          sshpass -p "${{ secrets.LAB_SERVER_PASSWORD }}" scp -P ${{ secrets.LAB_SERVER_PORT }} -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.LAB_SERVER_USER }}@${{ secrets.LAB_SERVER_HOST }}:/home/web/site252623/html/
          sshpass -p "${{ secrets.LAB_SERVER_PASSWORD }}" ssh -p ${{ secrets.LAB_SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.LAB_SERVER_USER }}@${{ secrets.LAB_SERVER_HOST }} "cd /home/web/site252623/html && tar -zxvf deploy.tar.gz && rm deploy.tar.gz"

      - name: Esegui Database & Image Seed (Opzionale)
        if: ${{ inputs.run_seed == true }}
        run: |
          sshpass -p "${{ secrets.LAB_SERVER_PASSWORD }}" ssh -p ${{ secrets.LAB_SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.LAB_SERVER_USER }}@${{ secrets.LAB_SERVER_HOST }} "cd /home/web/site252623/html && docker-compose run --rm backend npm run seed"