<nav aria-label="Menu principale">
  <ul role="list">
    <li>
      <a href="/marketplace" [class.active]="isActive('/marketplace')"> Marketplace </a>
    </li>
    @for (item of navItems; track item.label) {
      <li>
        @if (isAngular) {
          <a
            [routerLink]="item.path"
            [class.active]="isActive(item.path)"
          >{{ item.label }}</a>
        } @else {
          <a [href]="item.path" [class.active]="isActive(item.path)">{{ item.label }}</a>
        }
      </li>
    }

    <li class="auth-nav-item">
      @if (authService.isLoggedIn()) {
        <div class="user-badge-container">
          <span class="user-badge" title="Utente collegato">
            <span class="user-icon">👤</span>
            <span class="user-name">{{ authService.userDisplayName() || 'Utente' }}</span>
          </span>
          <button type="button" class="logout-nav-btn" (click)="onLogout()" title="Disconnettiti">
            Logout
          </button>
        </div>
      } @else {
        @if (isAngular) {
          <a [routerLink]="'/login'" [class.active]="isActive('/login')">Login</a>
        } @else {
          <a href="/login" [class.active]="isActive('/login')">Login</a>
        }
      }
    </li>
  </ul>
</nav>
