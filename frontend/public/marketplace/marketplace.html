<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtAround - Full Marketplace</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f0f2f5;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .sidebar {
      background: white;
      border-right: 1px solid #e3e6f0;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #4e73df;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 1.5rem 0 0.75rem;
      border-bottom: 2px solid #f8f9fc;
      padding-bottom: 0.25rem;
    }

    .card-opera {
      border: none;
      border-radius: 1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-opera:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .btn-add {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .chip {
      background: #eaecf4;
      color: #5a5c69;
      padding: 0.2rem 0.6rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 600;
      display: flex;
      align-items: center;
    }

    .chip i {
      cursor: pointer;
      margin-left: 4px;
      color: #e74a3b;
    }
  </style>
</head>

<body>

  <div class="container-fluid">
    <div class="row">
      <!-- SIDEBAR: CREAZIONE OPERA COMPLETA -->
      <nav class="col-md-5 col-xl-3 sidebar shadow-sm">
        <div class="d-flex align-items-center mb-4 text-primary">
          <i class="bi bi-box-seam-fill fs-3 me-2"></i>
          <h4 class="mb-0 fw-bold">Gestione Opera</h4>
        </div>

        <form id="opera-form">
          <div class="section-title">Informazioni Generali</div>
          <div class="mb-2">
            <input type="text" id="title" class="form-control form-control-sm" placeholder="Titolo Opera" required>
          </div>
          <div class="mb-2">
            <textarea id="description" class="form-control form-control-sm" rows="2"
              placeholder="Descrizione"></textarea>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6"><input type="number" id="startYear" class="form-control form-control-sm"
                placeholder="Anno Inizio"></div>
            <div class="col-6"><input type="number" id="endYear" class="form-control form-control-sm"
                placeholder="Anno Fine"></div>
          </div>

          <div class="section-title">Autori e Musei</div>
          <div class="input-group input-group-sm mb-1">
            <input type="text" id="maker-id" class="form-control" placeholder="ID Autore">
            <button class="btn btn-primary btn-add" type="button" id="add-maker-btn">+</button>
          </div>
          <div id="makers-chips" class="chip-container mb-2"></div>
          <div class="mb-2">
            <input type="text" id="museum" class="form-control form-control-sm" placeholder="ID Museo">
          </div>

          <div class="section-title">Posizionamento & Tag</div>
          <div class="row g-2 mb-2">
            <div class="col-4"><input type="text" id="room" class="form-control form-control-sm" placeholder="Stanza">
            </div>
            <div class="col-4"><input type="text" id="floor" class="form-control form-control-sm" placeholder="Piano">
            </div>
            <div class="col-4"><input type="text" id="building" class="form-control form-control-sm"
                placeholder="Edificio"></div>
          </div>
          <div class="input-group input-group-sm mb-1">
            <input type="text" id="current" class="form-control" placeholder="Corrente Artistica">
            <button class="btn btn-primary btn-add" type="button" id="add-current-btn">+</button>
          </div>
          <div id="currents-chips" class="chip-container mb-2"></div>

          <div class="section-title">Dettagli Tecnici (Dettagli Schema)</div>
          <div class="mb-2"><input type="text" id="objType" class="form-control form-control-sm"
              placeholder="Tipo Oggetto"></div>
          <div class="input-group input-group-sm mb-1">
            <input type="text" id="technique" class="form-control" placeholder="Aggiungi Tecnica">
            <button class="btn btn-primary btn-add" type="button" id="add-tech-btn">+</button>
          </div>
          <div id="techs-chips" class="chip-container mb-2"></div>
          <div class="input-group input-group-sm mb-1">
            <input type="text" id="material" class="form-control" placeholder="Aggiungi Materiale">
            <button class="btn btn-primary btn-add" type="button" id="add-mat-btn">+</button>
          </div>
          <div id="mats-chips" class="chip-container mb-2"></div>

          <div class="section-title">Relazioni & Dimensioni</div>
          <div class="row g-2 mb-2">
            <div class="col-6"><input type="text" id="copyOf" class="form-control form-control-sm"
                placeholder="Copia di (ID)"></div>
            <div class="col-6"><input type="text" id="falsificationOf" class="form-control form-control-sm"
                placeholder="Falso di (ID)"></div>
          </div>
          <div class="row g-2">
            <div class="col-3"><input type="number" id="h" class="form-control form-control-sm" placeholder="H"></div>
            <div class="col-3"><input type="number" id="w" class="form-control form-control-sm" placeholder="L"></div>
            <div class="col-3"><input type="number" id="d" class="form-control form-control-sm" placeholder="P"></div>
            <div class="col-3"><input type="text" id="unit" class="form-control form-control-sm" value="cm"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-4 py-2 shadow">
            <i class="bi bi-save-fill me-2"></i>Registra Opera
          </button>
        </form>
        <div id="msg" class="mt-3"></div>
      </nav>

      <!-- MAIN CONTENT: GALLERIA DINAMICA -->
      <main class="col-md-7 col-xl-9 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="fw-bold m-0">Catalogo ArtAround</h2>
          <div class="d-flex gap-2">
            <span id="counter" class="badge bg-white text-primary border p-2 px-3 rounded-pill shadow-sm fs-6">
              0 Opere
            </span>
          </div>
        </div>

        <div id="grid" class="row g-4">
          <!-- Generato da marketplace.js -->
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="marketplace.js"></script>
</body>

</html>
